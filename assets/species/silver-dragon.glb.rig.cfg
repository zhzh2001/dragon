# Silver: independently measured athletic quadruped with crescent sails.
neck_stiffness_scale 8
neck_inertia_scale 0.12
chain_tone 2.4
tail_damping_scale 1.6
tail_tip_stiffness 0.25
tail_range_deg 90
tail_rudder_deg 18
tail_elevator_deg 8

# A broad continuous membrane needs moderate shoulder and fan motion.
flap_shoulder_deg 28
wing_flap_limit_deg 34
wing_phase_lag 0.08
wing_phase_delay 0.065
wing_downstroke_fraction 0.46
upstroke_fold_deg 8
wing_flap_fold_deg 5
wing_recovery_fold_deg 3
wing_recovery_extend_phase 0.68
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 0.65
wing_finger_fold_scale 0.65
# Let the wrist follow the shoulder without drawing the inner ray across the back.
recovery_wrist_deg 7
recovery_elbow_deg 6
recovery_finger_deg 4
recovery_droop_deg 5
wing_rest_deg -8
tuck_sweep_deg 45
tuck_fold_deg 28
tuck_droop_deg 0
speed_sweep_deg 10
speed_fold_deg 4

# Hold the folded legs through the beat. Let the paws give slightly on turns.
leg_flight_pose 1
hind_flight_hip_deg 42
hind_flight_knee_deg 12
hind_flight_hock_deg 28
fore_flight_shoulder_deg 31
fore_flight_elbow_deg 48
fore_flight_wrist_deg 23
leg_flight_splay_deg -12
foot_hang_deg 0
toe_curl_deg 4
limb_stiffness 110
limb_tip_stiffness 0.85
limb_damping 0.95
limb_inertia 0.4
limb_gravity 0.5
limb_range_deg 14
limb_turbulence 0.8
leg_brake_extend 0.8
leg_brake_forward_deg 30
leg_sway_max_deg 30
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_posture_sway 0.2
leg_dive_trail_deg 20

# Close the sculpted mouth slightly at rest; keep gestures restrained.
jaw_rest_deg -18
jaw_open_deg 22

# Keep the authored standing legs, lift the blade tail and aim the folded sails.
ground_stance 1
ground_neck_pitch_deg 0
ground_tail_pitch_deg 24
# Fold the forearm forward and carry the four rays aft along the flank.
ground_wing_aim 1
ground_wing_arm_sweep_deg 81
ground_wing_arm_elev_deg 13
ground_wing_forearm_sweep_deg -73
ground_wing_forearm_elev_deg 34
ground_wing_hand_sweep_deg 90
