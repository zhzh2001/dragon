# Silver: independently measured athletic quadruped with crescent sails.
neck_stiffness_scale 8
neck_inertia_scale 0.12
chain_tone 2.4
tail_damping_scale 1.6
tail_tip_stiffness 0.25
tail_range_deg 90
tail_rudder_deg 18
tail_elevator_deg 8

# A broad continuous membrane needs moderate shoulder and fan motion.
flap_shoulder_deg 28
wing_flap_limit_deg 34
wing_phase_lag 0.08
wing_phase_delay 0.035
wing_downstroke_fraction 0.42
upstroke_fold_deg 12
wing_flap_fold_deg 10
wing_recovery_fold_deg 6
wing_recovery_extend_phase 0.68
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 0.65
wing_finger_fold_scale 0.65
tuck_sweep_deg 45
tuck_fold_deg 28
tuck_droop_deg 0
speed_sweep_deg 10
speed_fold_deg 4

leg_tuck_deg 10
leg_trail_deg 5
front_leg_trail_deg 5
foot_hang_deg 10
toe_curl_deg 6
leg_brake_extend 0.8
leg_brake_forward_deg 30
leg_sway_max_deg 30
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_posture_sway 0.2
leg_dive_trail_deg 20

# Close the sculpted mouth slightly at rest; keep gestures restrained.
jaw_rest_deg -18
jaw_open_deg 22

# Keep the authored standing legs, lift the blade tail and aim the folded sails.
ground_stance 1
ground_neck_pitch_deg 0
ground_tail_pitch_deg 24
# Sweep the broad sail as one surface; individual joint aiming creases it.
ground_wing_aim 0
ground_stow_tuck_share 0
ground_stow_sweep_deg 45
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0
