# Gold dragon: long serpentine tail and compact sail wings.
# Tuned against its own measured skeleton; preserve membrane continuity.
neck_stiffness_scale 8
neck_inertia_scale 0.12
chain_tone 2.4
tail_damping_scale 1.1
tail_tip_stiffness 0.16
tail_range_deg 160
# Arc-length wave leaves the base held and travels into the loose tail fin.
tail_flow_deg 32
tail_flow_period 4.8
tail_flow_cycles 1.1
tail_rudder_deg 12
tail_elevator_deg 6
flap_shoulder_deg 28
wing_flap_limit_deg 32
wing_phase_lag 0.08
wing_phase_delay 0.035
wing_downstroke_fraction 0.42
upstroke_fold_deg 6
wing_flap_fold_deg 6
wing_recovery_fold_deg 4
wing_recovery_extend_phase 0.68
wing_elbow_fold_scale 0.45
wing_finger_fold_scale 0.5
tuck_sweep_deg 40
tuck_fold_deg 20
tuck_droop_deg 0
speed_sweep_deg 8
speed_fold_deg 3

leg_tuck_deg 10
leg_trail_deg 5
front_leg_trail_deg 5
foot_hang_deg 8
toe_curl_deg 6
leg_brake_extend 0.8
leg_brake_forward_deg 30
leg_sway_max_deg 30
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_posture_sway 0.2
leg_dive_trail_deg 20
jaw_rest_deg 0
# The generated sculpt has a sealed lip seam; keep the jaw gesture subtle.
jaw_open_deg 4

# Retain the sculpt's standing limbs and sweep the membrane as one surface.
ground_stance 1
ground_neck_pitch_deg 2
# Lift the long aft chain clear of the floor without floating the four feet.
ground_tail_pitch_deg 30
ground_wing_aim 0
ground_stow_tuck_share 0
ground_stow_sweep_deg 45
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0
