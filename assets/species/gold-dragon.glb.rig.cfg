# Gold dragon: long serpentine tail and compact sail wings.
# Tuned against its own measured skeleton; preserve membrane continuity.
neck_stiffness_scale 8
neck_inertia_scale 0.12
chain_tone 2.4
tail_damping_scale 1.1
tail_tip_stiffness 0.16
tail_range_deg 160
# Arc-length wave leaves the base held and travels into the loose tail fin.
tail_flow_deg 32
tail_flow_period 4.8
tail_flow_cycles 1.1
tail_rudder_deg 12
tail_elevator_deg 6
flap_shoulder_deg 28
wing_flap_limit_deg 32
wing_phase_lag 0.08
wing_phase_delay 0.065
wing_downstroke_fraction 0.46
upstroke_fold_deg 8
wing_flap_fold_deg 4
wing_recovery_fold_deg 3
wing_recovery_extend_phase 0.68
wing_elbow_fold_scale 0.45
wing_finger_fold_scale 0.5
# Let the wrist follow the shoulder without drawing the inner ray across the back.
recovery_wrist_deg 7
recovery_elbow_deg 6
recovery_finger_deg 4
recovery_droop_deg 5
tuck_sweep_deg 40
tuck_fold_deg 20
tuck_droop_deg 0
speed_sweep_deg 8
speed_fold_deg 3

# Hold the folded legs through the beat. Let the paws give slightly on turns.
leg_flight_pose 1
hind_flight_hip_deg 36
hind_flight_knee_deg 10
hind_flight_hock_deg 26
fore_flight_shoulder_deg 42
fore_flight_elbow_deg 64
fore_flight_wrist_deg 26
leg_flight_splay_deg -8
foot_hang_deg 0
toe_curl_deg 4
limb_stiffness 110
limb_tip_stiffness 0.85
limb_damping 0.95
limb_inertia 0.4
limb_gravity 0.5
limb_range_deg 14
limb_turbulence 0.8
leg_brake_extend 0.8
leg_brake_forward_deg 30
leg_sway_max_deg 30
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_posture_sway 0.2
leg_dive_trail_deg 20
jaw_rest_deg 0
# The generated sculpt has a sealed lip seam; keep the jaw gesture subtle.
jaw_open_deg 4

# Retain the sculpt's standing limbs and sweep the membrane as one surface.
ground_stance 1
ground_neck_pitch_deg 2
# Lift the long aft chain clear of the floor without floating the four feet.
ground_tail_pitch_deg 30
# Fold the forearm forward and carry the four rays aft along the flank.
ground_wing_aim 0.96
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 10
ground_wing_forearm_sweep_deg -62
ground_wing_forearm_elev_deg 23
ground_wing_hand_sweep_deg 83
ground_wing_hand_elev_deg -12
ground_wing_fan_deg 8
ground_stow_tuck_share 0
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0
