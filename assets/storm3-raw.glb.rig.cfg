# Storm3 has three arm bones and four ribs per wing.
# The tuck sweeps the wings back in a dive.
tuck_sweep_deg 40
tuck_fold_deg 10
# Previously 30. Keep the trailing hooks clear of the tucked shins.
tuck_droop_deg 5
# Previously -14. Keep the wing swept aft during the dive release.
speed_sweep_deg 14
speed_fold_deg 0

# The elbow, wrist and fingers share the fold.
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1

# The standing pose uses wrist targets. The angle-based stow stays off.
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# The idle pose closes the sculpted gape. The jaw opens during the breath attack.
jaw_rest_deg -19
jaw_open_deg 30

# The ground stance controls the wing arms independently of the flight tuck.
ground_stow_tuck_share 0
ground_stow_elbow_scale 0

# The wrists land ahead of the hind toes. The tail rudder clears the level floor.
ground_stance 1
ground_wing_plant 1
ground_wing_aim 1
# Previously -20. Lift the chest from the horizontal flight bind.
ground_body_pitch_deg 27
# Previously 24. Bring the hind toes under the grounded hip.
ground_hip_deg 14
ground_knee_deg -49
ground_ankle_deg 20
# Previously 35. Raise the neck while the muzzle faces forward.
ground_neck_pitch_deg 1
# Previously -23. Lift the fluke clear of the resting toes.
ground_tail_pitch_deg 48
ground_lift_m .164
# Previously -30. Widen the planted wrist position.
ground_wing_arm_sweep_deg -18
# Previously -24. Keep the chest above the planted wrist.
ground_wing_arm_elev_deg -21
# Previously -40. Reach forward of the hind feet.
ground_wing_forearm_sweep_deg -60
# Previously -80. Lower the wrist pad to the toe plane.
ground_wing_forearm_elev_deg -65
# Previously 100. Fold the hand back toward the flank.
ground_wing_hand_sweep_deg 118
# Previously 55. Lower the trailing hooks beside the body.
ground_wing_hand_elev_deg 25
# Previously 6. Gather the ribs along the forearm.
ground_wing_fan_deg 0

# The legs fold under the body in flight.
leg_tuck_deg 45
leg_trail_deg 30
front_leg_trail_deg 30
foot_hang_deg 10
toe_curl_deg 8

# The legs swing during turns and braking.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_brake_extend 0.8
leg_brake_forward_deg 35

# In a dive, the fingers close toward the leading rib.
# Previously 20. Narrow the four ribs toward the leading edge.
tuck_converge_deg 37

# The scale gives Storm3 a body length of 13.55 m.
model_span_m 14.65

# Previously 0. Raise the low inner ribs through the cruise beat.
wing_level_share 0.45

# The speed sweep starts above cruise speed.
# Previously 22. Keep the speed sweep out of the level cruise beat.
sweep_speed_start 34
sweep_speed_full 75

# Previously -20. Lower the leading tip after leveling the inner wing.
wing_rest_deg -28
# Previously 0. Give each hind joint its own flight angle.
leg_flight_pose 1
# Previously 0. Keep the thigh under the reposed hip.
hind_flight_hip_deg 9
# Previously 0. Fold the shin against the belly.
hind_flight_knee_deg 27
# Previously 0. Point the foot aft alongside the tail.
hind_flight_hock_deg 47
# Previously 0. Draw the feet toward the tail root.
leg_flight_splay_deg -12
# Previously 45. Limit foot travel through the beat.
limb_range_deg 0.6
# Previously 35. Hold the thigh during the stroke reversal.
limb_stiffness 110
# Previously 0.5. Hold the foot almost as firmly as the hip.
limb_tip_stiffness 0.85
# Previously 0.6. Settle the foot as the wing changes direction.
limb_damping 0.95
# Previously 0.4. Match the recovery timing to the flight profile.
wing_downstroke_fraction 0.48
# Previously 22. Reduce the forward throw at the bottom of the beat.
stroke_plane_tilt_deg 12
# Previously 18. Reduce the twist across the loaded sheet.
stroke_twist_deg 10
