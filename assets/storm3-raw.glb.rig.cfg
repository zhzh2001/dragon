wing_phase_delay 0.035
# Previously 11. Keep the inner membrane open as the arm rises.
recovery_elbow_deg 4
# Previously 17. Limit travel of the inner hook across the spine.
recovery_wrist_deg 10
# Previously 13. Narrow the fan while keeping its ribs apart.
recovery_finger_deg 8
# Previously 15. Lift the recovering tips clear of the legs.
recovery_droop_deg 8
# Previously 0.72. Hold the narrower hand until late recovery.
wing_recovery_extend_phase 0.79
# Previously 24. Limit folding at the top of the beat.
upstroke_fold_deg 15
# Previously 4. Sweep the loaded wing aft during the bank.
load_forward_sweep_deg -20
