# frost3 rig profile.

neck_stiffness_scale 8
neck_inertia_scale 0.12
tail_damping_scale 1.5
tail_range_deg 60
chain_tone 2.4

leg_tuck_deg 10
leg_trail_deg 19
front_leg_trail_deg 15
foot_hang_deg 10
toe_curl_deg 8
leg_brake_extend 0.8
leg_brake_forward_deg 35

wing_flap_limit_deg 34
upstroke_fold_deg 14

tuck_sweep_deg 55
tuck_fold_deg 35
tuck_droop_deg 5
speed_sweep_deg 15

ground_wing_aim 1
ground_wing_arm_sweep_deg 79
ground_wing_arm_elev_deg 17
ground_wing_forearm_sweep_deg -58
ground_wing_forearm_elev_deg 29
ground_wing_hand_sweep_deg 85
ground_wing_hand_elev_deg -5
ground_wing_fan_deg 6

jaw_rest_deg -16
jaw_open_deg 25

ground_stance 1
ground_tail_pitch_deg 3

leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5

leg_dive_trail_deg 25

# The hero's recovery fold keeps the wrist moving through the beat.
# Frost3 uses less upstroke to keep the outer ribs on their own side.
wing_flap_limit_deg 130
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_phase_delay 0.10
wing_downstroke_fraction 0.5
wing_flap_fold_deg 14
wing_recovery_fold_deg 8
wing_recovery_extend_phase 0.82
recovery_elbow_deg 10
recovery_wrist_deg 12
recovery_finger_deg 6
recovery_droop_deg 20
upstroke_fold_deg 22
wing_wrist_fold_scale 1.0
finger_load_curl_deg 24
tail_beat_deg 40
tail_beat_lag 0.18
tail_beat_cycles 0.45
gust_deg 2
gust_heave_m 0.18
glide_trim_deg 3.5
glide_breath_deg 1.6
flutter_deg 2.6
flutter_speed_start 26
tail_flow_deg 38
tail_flow_period 3.6
tail_flow_cycles 0.9
tail_flow_vertical 0.3

model_span_m 14.45

# The glide. The model is bound with its wings raised about 30 degrees, as
# its sheet drew them, and the flight model's glide is 9 degrees over the
# bind: a steep V. This lowers the wing in flight to the hero's dihedral.
# The stroke angles in the flight profile are measured from here.
wing_rest_deg -22

# --- the hero's legs in flight (2026-11-22). The playtester on these
# profiles: "leg not tucked; wriggle weirdly" (report 0028), "leg issue"
# (0029), "leg tucking is not implemented like embercrest". The profile came
# from an older sibling, whose legs hang and swing on the sway spring. This
# is embercrest-hero's block: an authored tuck (leg_flight_pose), held by
# the limb springs, with 14 degrees of give.
leg_flight_pose 1
hind_flight_hip_deg 45
hind_flight_knee_deg 5
hind_flight_hock_deg 35
fore_flight_shoulder_deg 25
fore_flight_elbow_deg 60
fore_flight_wrist_deg 30
leg_flight_splay_deg -18
leg_tuck_deg -30
leg_trail_deg 45
front_leg_trail_deg 30
front_leg_tuck_deg 60
foot_hang_deg 0
toe_curl_deg 4
limb_stiffness 110
limb_tip_stiffness 0.85
limb_damping 0.95
limb_inertia 0.4
limb_gravity 0.5
limb_range_deg 14
limb_turbulence 0.8

# The recovery fold, smaller than the hero's (2026-11-22). With the stroke
# raised (the flight profile), the folded hands met and crossed over the
# back at the top of the beat: these wings are narrower at the root than
# the hero's and their ribs longer for their arm.
upstroke_fold_deg 10
wing_flap_fold_deg 6
wing_recovery_fold_deg 3
recovery_elbow_deg 6
recovery_wrist_deg 6
recovery_finger_deg 3

# The neck, stiff (2026-11-22). The playtester on the beat (report 0030):
# "neck motion unnatural, maybe should stay stiff?" The head was held still
# against the body's heave (beat_head_hold 0.75, the default), so this
# short thick neck and its ruff bent at the base on every beat. The head
# rides the body now, and the chain has less range and less inertia.
beat_head_hold 0.25
neck_stiffness_scale 14
neck_inertia_scale 0.05
neck_range_deg 14
