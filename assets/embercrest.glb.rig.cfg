# Embercrest textured rig profile.
#
# The imported wing has a shoulder -> elbow -> wrist arm and three finger
# chains. Keep the elbow open, then let the wrist and fingers make the fold.
# The flap ceiling protects the long membranes at the top of the stroke.
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1
wing_phase_lag 0.08
wing_phase_delay 0.035
wing_downstroke_fraction 0.40
wing_flap_fold_deg 14
wing_flap_limit_deg 42
wing_recovery_fold_deg 10
wing_recovery_extend_phase 0.68
upstroke_fold_deg 30

# The unprofiled speed/tuck fold put the wing tips nearly vertical in the dive.
tuck_sweep_deg 75
tuck_fold_deg 45
tuck_droop_deg 30
speed_sweep_deg 20
speed_fold_deg 8

# Keep the four limbs clear of the torso; braking partially unfolds them and
# lets the hips float toward the engine-forward direction.
leg_tuck_deg 60
leg_trail_deg 15
front_leg_trail_deg 15
leg_brake_extend 0.8
leg_brake_forward_deg 35

# The sculpt is already open. Close at idle; attack returns to the sculpted
# gape rather than stretching the cheek beyond it.
jaw_rest_deg -16
jaw_open_deg 16

# Standing wing, aimed. The angle stow (ground_stow_*) that lived here curled
# this wing into a hoop over the back: its hinges turn about the sculpt's
# membrane plane, so the fingers commanded "up" also came inboard and the
# closed fan met the humerus. The fold is now described by where each
# segment points, in the body frame (sweep from straight out toward aft,
# elevation from horizontal), and aimed bone by bone -- see
# docs/concept/standing-dragon-reference.png for the target: upper arm back
# along the flank, forearm folded forward and up so the wrist rises just
# above the shoulder, fingers folded back and hanging down the flank with the
# tips past the hips. Chosen from four rendered candidates side/front/rear/
# top; the higher forearm elevations stood the wrists up as ears.
# The angle stow is zeroed so it contributes nothing under the aim.
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0
ground_wing_aim 1
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 15
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg 35
ground_wing_hand_sweep_deg 88
ground_wing_hand_elev_deg -20
ground_wing_fan_deg 8

# This sculpt was generated standing, so its bind pose is its stance: no
# ground_stance block.
foot_hang_deg 10
toe_curl_deg 8

# Flight fold is relative to the sculpted bend. Lower the combined hip/ankle
# rotation and paw curl so the feet remain below the hips and off the chest.
# Full-size glide, beat, dive and game checks: artifacts/flight-pose-fix/.
# --- legs as pendulums. The code defaults (26 degrees of swing, stiffness
# 16, damping 6) let the legs hang correctly but barely move: a coordinated
# turn puts the effective gravity straight down the body, so only the
# reversals and the brake swing them, and the stiff spring followed those so
# closely that eight frames through an s-turn looked like one. Wider swing,
# more response to the frame's pseudo-forces, a slower and less damped spring,
# and a fuller float on the brake; measured with tools/rig_probes/
# leg_swing_probe (thigh range through the s-turn 30 -> 47 degrees on
# Frostvein) and rendered as eight-frame sequences.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5

# --- first-person eye (V). Body-frame metres from the head joint.
# The horn crown rises about a metre above the skull and filled the
# frame at the default height; from here the horns are just out of shot and
# the snout tip shows at the bottom.
# Found by rendering --cam-mode fp; the defaults (1.1 up, 1.6 back) suit a
# plain skull.
first_person_up 2.0
first_person_back 1.6
