# rimefang: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 46.0
neck_stiffness_scale 8.0
neck_inertia_scale 0.12
tail_damping_scale 1.55
tail_range_deg 66.0
chain_tone 2.4

# --- wing stow. NOT optional: every ground_stow_* field defaults to 0.0 in
# dragon_rig.h, which means "do not fold at all", so a rig profile that lists
# only its character fields leaves the creature unable to close its wings on
# the ground or in a dive. Seeded from Embercrest's hand-tuned values.
tuck_droop_deg 12
speed_sweep_deg 20
ground_stow_sweep_deg 55
ground_stow_fold_deg 20
ground_stow_wrist_deg 20
ground_stow_finger_deg -100
ground_stow_close_deg 90
ground_stow_converge_deg 90

# --- legs. Seeded like the stow block: the code defaults (tuck 62, trail
# 38/30) left this creature hanging its legs under the body like landing
# gear. A deeper tuck with a moderate trail presses them up along the belly
# -- chosen from three variants rendered side-on and head-on in the glide.
leg_tuck_deg 72
leg_trail_deg 22
front_leg_trail_deg 18
leg_brake_extend 0.65
leg_brake_forward_deg 30
