# rimefang: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 46.0
neck_stiffness_scale 8.0
neck_inertia_scale 0.12
tail_damping_scale 1.55
tail_range_deg 66.0
chain_tone 2.4

# --- wing stow. The ground_stow_* angle stow is zeroed: this wing is folded
# by the aimed stow at the end of the file. (Every ground_stow_* field
# defaults to 0.0 in dragon_rig.h, "do not fold at all", so a profile that
# lists only its character fields leaves the creature unable to close its
# wings on the ground -- the aim block below is what closes them now.)
tuck_droop_deg 30
speed_sweep_deg 20
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# --- legs. Seeded like the stow block: the code defaults (tuck 62, trail
# 38/30) left this creature hanging its legs under the body like landing
# gear. A deeper tuck with a moderate trail presses them up along the belly
# -- chosen from three variants rendered side-on and head-on in the glide,
# then trailed further aft after the beat was seen from below: with the
# knees splayed under the belly the downstroke swept the inner membrane
# through them. Pressed back along the tail base they stay behind it.
leg_tuck_deg 65
leg_trail_deg 15
front_leg_trail_deg 15
leg_brake_extend 0.65
leg_brake_forward_deg 30

# --- jaw. Sculpted mouth-open like the rest of the roster: close at idle,
# open back to the sculpt on the breath. Only meaningful since the rebuild
# that put the mandible on the jaw bone (artifacts/rimefang/jaw-mask/README.md);
# before it this rotation lifted the snout. -20 over-closed it in every
# scenario: the mandible rose through the upper teeth. Three rest angles
# rendered side-on in the glide (--inspect 90 3.5 0 --inspect-head); -13 is
# where the mouth just shuts.
jaw_rest_deg -13
jaw_open_deg 20

# --- dive tuck. Chosen from three tucks rendered side-on, head-on and from
# above at full tuck in the studio dive: the code defaults (88/52) folded the
# hands out sideways and hung membrane through the legs, and a shallower
# fold left a half-open delta. The elbow stays open and the fingers close
# harder, as on Embercrest, so the hand folds without forcing the elbow
# through the torso.
tuck_sweep_deg 75
tuck_fold_deg 30

# --- standing. This sculpt was generated from a rearing turnaround: its bind
# pose is a leap, chest high, hind legs trailing, forelegs reaching down, and
# the shared winged-quadruped skeleton was remapped into it by bounding box,
# so on the ground the bind pose stood it on its hands with the hind feet a
# metre in the air. The stance below pitches the body down at the hips and
# re-poses the legs; ground_feet_level then lifts the root so the lowest foot
# sits on the floor the bind soles stood on, which keeps flight.cfg's
# ground_offset true. Chosen from 1,600 numerically screened candidates
# (all four feet within 1 cm of one floor, thigh forward of vertical, shin
# aft, forearm near vertical) and three of those rendered side/front/rear/top.
# A more level body (-20) balanced only with the elbows hooked under the
# chest; -15 stands it like an alert cat, chest a little high.
ground_stance 1
ground_body_pitch_deg -15
ground_hip_deg -8
ground_knee_deg 75
ground_ankle_deg -40
ground_shoulder_deg 40
ground_elbow_deg -40
ground_wrist_deg 0

# The wing is folded by aiming each segment at a body-frame direction (sweep
# from straight out toward aft, elevation from horizontal) instead of the
# angle stow, which on this sculpt's tilted membrane plane stood the wings up
# as two sails whatever the numbers. Embercrest's directions carry over
# unchanged: the point of describing the fold this way is that they do.
# Target: docs/concept/standing-dragon-reference.png.
ground_wing_aim 1
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 15
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg 35
ground_wing_hand_sweep_deg 88
ground_wing_hand_elev_deg -20
ground_wing_fan_deg 8

# --- sole clearance. The stance keeps the lowest foot JOINT on the bind floor,
# and the paw mesh under a rotated foot reaches below it; measured by skinning
# the mesh on the CPU in the grounded stance (scratch sink probe) and taking
# the lowest vertex against the bind floor.
ground_lift_m 0.15

# --- legs in flight, re-found after the playtest report "feet stretching too
# high": tuck and trail both rotate the thigh aft, so 80 of tuck over 60 of
# trail carried the thigh past vertical and pointed the feet at the sky, two
# metres ABOVE the hips. Screened over a tuck x trail grid in the glide for
# feet 0.6-1.4 m below the hips, 2.5-4 m aft, thigh 40-70 degrees aft and
# the shin not folded past horizontal (scratch leg probe), then rendered
# from behind and below in the glide and the flap. The legs now stream back
# under the tail base like a flying bird's.
