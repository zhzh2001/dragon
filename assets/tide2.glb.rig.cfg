# Drawn at a 12.2 m span, not the flight model's 19: its wings are short for its
# body, and at 19 m the body was 20.6 m against the hero's 14.2.
model_span_m 12.2

# The wingbeat and the life of the hero's profile (2026-11-22). As built this
# creature flapped as a flat board through 35 degrees: the playtester, "new
# models flapping is very mechanic". The wing now folds at the wrist on the
# upstroke, leads with the arm, and reaches under the body on the downstroke;
# the tail answers the beat and the glide breathes. The stroke is the hero's
# less 37 degrees at the bottom (the flight profile): at the hero's -125 these
# shorter wings closed under the belly.
wing_flap_limit_deg 130
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_phase_delay 0.10
wing_downstroke_fraction 0.5
wing_flap_fold_deg 14
wing_recovery_fold_deg 8
