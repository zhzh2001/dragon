# tide2 rig profile.
neck_stiffness_scale 8
neck_inertia_scale 0.12
tail_damping_scale 1.5
tail_range_deg 60
chain_tone 2.4
leg_tuck_deg 10
leg_trail_deg 5
front_leg_trail_deg 5
foot_hang_deg 10
toe_curl_deg 8
leg_brake_extend 0.8
leg_brake_forward_deg 35
wing_flap_limit_deg 34
upstroke_fold_deg 14
tuck_sweep_deg 38
tuck_fold_deg 28
tuck_droop_deg 5
speed_sweep_deg 15
ground_wing_aim .88
ground_wing_arm_sweep_deg 72
ground_wing_arm_elev_deg 20
ground_wing_forearm_sweep_deg -48
ground_wing_forearm_elev_deg 40
ground_wing_hand_sweep_deg 84
ground_wing_hand_elev_deg 6
ground_wing_fan_deg 3.5
jaw_rest_deg -19
jaw_open_deg 30
ground_stance 1
ground_tail_pitch_deg 5
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_dive_trail_deg 25
# Drawn at a 12.2 m span, not the flight model's 19: its wings are short for its
# body, and at 19 m the body was 20.6 m against the hero's 14.2.
model_span_m 12.2

# The wingbeat and the life of the hero's profile (2026-11-22). As built this
# creature flapped as a flat board through 35 degrees: the playtester, "new
# models flapping is very mechanic". The wing now folds at the wrist on the
# upstroke, leads with the arm, and reaches under the body on the downstroke;
# the tail answers the beat and the glide breathes. The stroke is the hero's
# less 37 degrees at the bottom (the flight profile): at the hero's -125 these
# shorter wings closed under the belly.
wing_flap_limit_deg 130
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_phase_delay 0.10
wing_downstroke_fraction 0.5
wing_flap_fold_deg 14
wing_recovery_fold_deg 8
wing_recovery_extend_phase 0.82
recovery_elbow_deg 10
recovery_wrist_deg 12
recovery_finger_deg 6
recovery_droop_deg 20
upstroke_fold_deg 20
wing_wrist_fold_scale 1.0
finger_load_curl_deg 24
tail_beat_deg 40
tail_beat_lag 0.18
tail_beat_cycles 0.45
gust_deg 2
gust_heave_m 0.18
glide_trim_deg 3.5
glide_breath_deg 1.6
flutter_deg 2.6
flutter_speed_start 26
tail_flow_deg 38
tail_flow_period 3.6
tail_flow_cycles 0.9
tail_flow_vertical 0.3

# --- the hero's legs in flight (2026-11-22). The playtester on these
# profiles: "leg not tucked; wriggle weirdly" (report 0028), "leg issue"
# (0029), "leg tucking is not implemented like embercrest". The profile came
# from an older sibling, whose legs hang and swing on the sway spring. This
# is embercrest-hero's block: an authored tuck (leg_flight_pose), held by
# the limb springs, with 14 degrees of give.
leg_flight_pose 1
hind_flight_hip_deg 45
hind_flight_knee_deg 5
hind_flight_hock_deg 35
fore_flight_shoulder_deg 25
fore_flight_elbow_deg 60
fore_flight_wrist_deg 30
leg_flight_splay_deg -18
leg_tuck_deg -30
leg_trail_deg 45
front_leg_trail_deg 30
front_leg_tuck_deg 60
foot_hang_deg 0
toe_curl_deg 4
limb_stiffness 110
limb_tip_stiffness 0.85
limb_damping 0.95
limb_inertia 0.4
limb_gravity 0.5
limb_range_deg 14
limb_turbulence 0.8

# The recovery fold, smaller than the hero's (2026-11-22). With the stroke
# raised (the flight profile), the folded hands met and crossed over the
# back at the top of the beat: these wings are narrower at the root than
# the hero's and their ribs longer for their arm.
upstroke_fold_deg 10
wing_flap_fold_deg 6
wing_recovery_fold_deg 3
recovery_elbow_deg 6
recovery_wrist_deg 6
recovery_finger_deg 3

# The keyframed wingbeat at half weight, over half of the procedural beat.
# The playtester on 2026-11-24: the clip alone is "too conservative now,
# need wider range", and "a 0.5 mix ... seems to be good balance".
flap_clip 0.5
