# tidewrack: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 50.0
neck_stiffness_scale 4.0
neck_inertia_scale 0.26
tail_damping_scale 0.95
tail_range_deg 98.0
tail_tip_stiffness 0.16

# --- wing stow. NOT optional: every ground_stow_* field defaults to 0.0 in
# dragon_rig.h, which means "do not fold at all", so a rig profile that lists
# only its character fields leaves the creature unable to close its wings on
# the ground or in a dive. Seeded from Stormsail's hand-tuned values.
tuck_droop_deg 30
speed_sweep_deg 22
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# --- jaw. The sculpt is authored mouth-open. Close it at idle and let the
# breath open it back to the sculpted gape, exactly as Embercrest does;
# without this the mouth hangs open in flight and the attack dislocates it
# another 26 degrees past the sculpt. Angles found by rendering the head
# side-on (--inspect 90 4 0 --inspect-head) against --bind-pose.
jaw_rest_deg -22
jaw_open_deg 22

# --- dive tuck. Chosen from three tucks rendered side-on, head-on and from
# above at full tuck in the studio dive: the code defaults (88/52) folded the
# hands out sideways and hung membrane through the legs, and a shallower
# fold left a half-open delta. The elbow stays open and the fingers close
# harder, as on Embercrest, so the hand folds without forcing the elbow
# through the torso.
tuck_sweep_deg 75
tuck_fold_deg 45
wing_elbow_fold_scale 0.55
wing_finger_fold_scale 1.1

# --- standing on the wings. A wyvern has no forelegs: on the ground its
# wrists are its front feet, the arm reaching down and a little forward with
# the hand folded back up along the forearm and the membrane pleated between
# -- the pterosaur stance. The flight tuck is switched off on the ground
# because its aft sweep, in this sculpt's tilted membrane plane, lifted the
# arm faster than any elevation could lower it; the stow alone owns the
# standing wing. The elbow takes none of the wrist's fold, so the arm stays a
# strut. Found from an elevation-only pose and built up one term at a time
# (docs/ANIMATION.md, "Wings on the ground").
ground_stow_tuck_share 0
ground_stow_elbow_scale 0

# --- resting on the wings. The angle stow above is zeroed: it held the
# wings up beside the body with the hands in the air, whatever its numbers,
# because this sculpt stands upright like a theropod and the wing arm is
# short -- from an upright shoulder the wrist cannot reach the ground at all
# (bind: shoulder 6.9 m up, arm plus forearm 5 m). The pterosaur stance in
# docs/concept/standing-wyvern-reference.png (body level, wrists planted
# ahead of the feet) was screened first: it needs the body pitched 55
# degrees down, and rendered it reads as a crawl. What fits this body is a
# SITTING crouch: hips dropped by a deep hind-leg Z, body leaned a little
# forward, arms hanging to the ground with the wrists planted beside the
# feet and the wing finger folded back up; the neck is raised and the tail
# dropped against the lean. ground_wing_plant makes the wrists count as feet
# for the floor, so the fold that reaches them down is what sets the body's
# height. 432 crouches screened for wrists and feet on one floor, two
# rendered.
ground_stance 1
ground_wing_plant 1
ground_wing_aim 1
ground_body_pitch_deg -35
ground_hip_deg 40
ground_knee_deg -60
ground_ankle_deg 40
ground_neck_pitch_deg 35
ground_tail_pitch_deg -60
ground_wing_arm_sweep_deg -20
ground_wing_arm_elev_deg -75
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg -85
ground_wing_hand_sweep_deg 100
ground_wing_hand_elev_deg 55
ground_wing_fan_deg 6
