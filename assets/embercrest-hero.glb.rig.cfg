# Embercrest hero rig profile. Embercrest's profile, with the jaw changed for
# this sculpt. The wing numbers are Embercrest's and are not tuned here. The
# leg tuck and trail are this sculpt's own (mesh version 4, below).
#
# The imported wing has a shoulder -> elbow -> wrist arm and three finger
# chains. Keep the elbow open, then let the wrist and fingers make the fold.
# The flap ceiling protects the long membranes at the top of the stroke.
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1
wing_phase_lag 0.08
# The beat, retuned against the reference study (docs/MOTION_REFERENCE.md)
# for feedback 0015, "wings can have a larger flapping range" (2026-11-15).
# Before: delay 0.035, downstroke 0.40, limit 42, recovery fold 10 to phase
# 0.68, and the code's recovery angles (elbow 11, wrist 17, fingers 13,
# droop 15). The limit capped the stroke at 42 degrees a side whatever the
# flight model asked for, and the wing went up nearly open.
# Now the downstroke is half the beat, the hand trails the arm by a tenth
# of a beat, the stroke may reach 66 degrees, and the hand folds on the way
# up. Twice these recovery angles folded the wing like a bat's (span under
# half); the reference dragons keep 70 to 80%. The flight side of the beat
# (period, stroke angles) is in embercrest-hero.glb.flight.cfg.
wing_phase_delay 0.10
wing_downstroke_fraction 0.50
wing_flap_fold_deg 14
wing_flap_limit_deg 130
wing_recovery_fold_deg 14
wing_recovery_extend_phase 0.82
recovery_elbow_deg 16
recovery_wrist_deg 26
recovery_finger_deg 18
recovery_droop_deg 20
upstroke_fold_deg 30

# The unprofiled speed/tuck fold put the wing tips nearly vertical in the dive.
tuck_sweep_deg 75
tuck_fold_deg 45
tuck_droop_deg 30
speed_sweep_deg 20
speed_fold_deg 8

# Keep the four limbs clear of the torso; braking partially unfolds them and
# lets the hips float toward the engine-forward direction.
# 2026-11-15, mesh version 4. The legs are bent at bind: thigh 13 degrees
# forward of vertical, shin 62 aft, metatarsus 12 forward; upper arm 39 aft,
# forearm 23 forward. The tuck turns the hip aft, the knee forward and the
# hock aft. On version 2's straight legs 50 made a zigzag. On these legs 50
# opens every bend, and the hind leg trailed straight along the tail. A
# negative tuck closes the bends, and the trail then swings the folded leg
# back under the body. Chosen from eight rendered candidates in the glide
# (--studio 0 --inspect 270 11 0). Version 2's values were 50, 15 and 15.
leg_tuck_deg -30
leg_trail_deg 45
front_leg_trail_deg 30
# The fore legs fold on their own value: the hind legs' negative tuck opens
# the elbow. 60 closes it and brings the paws under the chest.
front_leg_tuck_deg 60
leg_brake_extend 0.8
leg_brake_forward_deg 35

# The hero sculpt is shut at bind, so the jaw rests there. Embercrest's -16
# drove the lower jaw into the skull. The verifier opens this jaw 35 degrees
# with the lower teeth clear of the upper lip.
jaw_rest_deg 0
jaw_open_deg 28

# Standing wing, aimed. The angle stow (ground_stow_*) that lived here curled
# this wing into a hoop over the back: its hinges turn about the sculpt's
# membrane plane, so the fingers commanded "up" also came inboard and the
# closed fan met the humerus. The fold is now described by where each
# segment points, in the body frame (sweep from straight out toward aft,
# elevation from horizontal), and aimed bone by bone -- see
# docs/concept/standing-dragon-reference.png for the target: upper arm back
# along the flank, forearm folded forward and up so the wrist rises just
# above the shoulder, fingers folded back and hanging down the flank with the
# tips past the hips. Chosen from four rendered candidates side/front/rear/
# top; the higher forearm elevations stood the wrists up as ears.
# The angle stow is zeroed so it contributes nothing under the aim.
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0
ground_wing_aim 1
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 15
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg 35
ground_wing_hand_sweep_deg 88
ground_wing_hand_elev_deg -20
ground_wing_fan_deg 8

# This sculpt was generated standing, so its bind pose is its stance: no
# ground_stance block.
# 2026-11-14, feedback 0001 mark 2 ("back stretch too much?" on the fore
# paw): the paw hung 10 degrees and its toes curled 8 more on a wrist the
# tuck had already folded, so the paw bent back on itself. No hang, half
# the curl. (The tuck of 50 this note set is replaced above for mesh
# version 4.)
foot_hang_deg 0
toe_curl_deg 4

# Flight fold is relative to the sculpted bend. Lower the combined hip/ankle
# rotation and paw curl so the feet remain below the hips and off the chest.
# Full-size glide, beat, dive and game checks: artifacts/flight-pose-fix/.
# --- legs as pendulums. The code defaults (26 degrees of swing, stiffness
# 16, damping 6) let the legs hang correctly but barely move: a coordinated
# turn puts the effective gravity straight down the body, so only the
# reversals and the brake swing them, and the stiff spring followed those so
# closely that eight frames through an s-turn looked like one. Wider swing,
# more response to the frame's pseudo-forces, a slower and less damped spring,
# and a fuller float on the brake; measured with tools/rig_probes/
# leg_swing_probe (thigh range through the s-turn 30 -> 47 degrees on
# Frostvein) and rendered as eight-frame sequences.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5

# --- the hero's legs are held, not hung (2026-11-14). Written for mesh
# version 2, whose legs were long straight columns: with the code's
# limb physics (stiffness 35, range 45 degrees) they dropped to vertical
# after a bite's surge and swung there for half a second: the playtest's
# "too loose, especially when swinging". A flying animal carries its legs
# with muscle. Stiffer joints, a foot nearly as stiff as the hip, a third of
# the range, less of the body's motion passed on and more damping.
# tools/showcase/strip.sh on studio 10, frames 14 to 58, is the check.
limb_stiffness 110
limb_tip_stiffness 0.85
limb_damping 0.95
limb_inertia 0.4
limb_gravity 0.5
limb_range_deg 14
limb_turbulence 0.8

# --- dive tuck, measured by tools/rig_probes/wing_clash_probe (studio dive, t=3 s).
# The open fan laid the trailing membrane through the flank and thighs;
# closing it toward the leading rib keeps the folded wing outside the body.
tuck_converge_deg 60
tuck_droop_deg 20

# --- life in the glide (2026-11-14). The playtest compared the glide with
# other dragon games: theirs shake slightly and the tail swings, ours held
# every bone. The code has the terms and this profile had them off or out
# of reach: the tail's travelling wave was 0 degrees, and the membrane's
# flutter began at 55 m/s, above the 40 m/s the dragon cruises at.
# The tail: a slow S that travels down its length. The wave bends the
# spring's target, and the tail's spring is soft toward the tip (a quarter
# of the base's stiffness), so at 9 degrees, and at 40, the tail stayed a
# straight spike: the tip never caught up with a 3 second wave. The tip is
# now as stiff as the base, so it follows, and the wave is large because
# its envelope is the square of the distance down the tail. From above,
# frames 100, 150 and 200 of the glide show the tip a tail's width to one
# side, then the other.
tail_flow_deg 38
tail_flow_period 3.6
tail_flow_cycles 0.9
tail_flow_vertical 0.3
tail_range_deg 160
tail_tip_stiffness 1.0
tail_damping_scale 0.85
# The air: more roll, pitch and heave from gusts, and each wing trimming
# on its own.
gust_deg 2.0
gust_heave_m 0.18
glide_trim_deg 3.5
glide_breath_deg 1.6
# The membrane buffets from 26 m/s, so a cruise has a shiver in the outer
# wing.
flutter_deg 2.6
flutter_speed_start 26

# --- the tail in time with the wings (2026-11-14 and 15, the user's ask).
# One swing of the tail for each wingbeat: down as the wings push, up as
# they recover, 40 degrees at the tip, a fifth of a beat behind the wings,
# with under half a wave along the tail so it reads as a whip and not a
# rod. The first version sent 18 degrees through the tail's spring and the
# spring passed a fifteenth of it. tools/showcase/strip.sh on studio 1,
# frames 120 to 162, is the check.
tail_beat_deg 40
tail_beat_lag 0.18
tail_beat_cycles 0.45

# The legs in flight, joint by joint (docs/SHOWCASE.md, "The legs in flight").
# With leg_flight_pose on, leg_tuck_deg, leg_trail_deg and the two front
# values above are not applied.
#
# The playtester chose "trail and tuck" on 2026-11-15, from six postures
# rendered side by side (artifacts/leg-options/options.jpg): the hind legs
# trail back along the tail and the fore legs fold to the chest. The hang
# tried earlier that day (feedback 0013) read as standing in the air. The
# Playtest panel's "flight leg posture" has all six, and their numbers are:
#   trail and tuck   hind 45 5 35     fore 65 -140 105   splay -18
#   trail both       hind 45 5 35     fore 40 60 30      splay -18
#   hind bent under  hind 30 20 30    fore 25 -20 45     splay -6
#   half hang        hind 18 -12 38   fore 25 -20 45     splay -6
#   hang             hind 8 -45 45    fore 25 -20 45     splay -6
#   fold             leg_flight_pose 0 (the tuck and trail values above)
#
# 2026-11-20, feedback 0016 ("front legs unnatural folding. if cannot fix,
# use the backwards folding"): the profile is "trail both" now. In the chest
# fold the elbow turned 140 degrees, the forearm doubled over the upper arm
# and the skin cracked at the shoulder; no angle short of a new skin weight
# mended it. Trailed, the fore legs lie back along the belly.
leg_flight_pose 1
hind_flight_hip_deg 45
hind_flight_knee_deg 5
hind_flight_hock_deg 35
# 2026-11-21, feedback 0017 ("can tuck slightly lower like this", on the
# brake's fore legs): the shoulder was 40 and the fore leg lay pressed into
# the belly. At 25 it hangs a hand's width under it.
fore_flight_shoulder_deg 25
fore_flight_elbow_deg 60
fore_flight_wrist_deg 30
leg_flight_splay_deg -18

# The keyframed strikes (assets/clips/embercrest-hero.attacks.glb). At full
# weight on top of the body's own lunge the tail whip curled under the body
# and the bite's tail stood upright; 0.6 keeps the strike and the shape.
attack_clip 0.6
attack_clip_under 0.15

# The strikes' timing and the legs' part in them (feedback 0014, "legs are
# ragdoll in melee attacks", and docs/MOTION_REFERENCE.md), 2026-11-15.
# The code's defaults are a 0.55 s bite and claw and a 0.75 s tail, a
# quarter of each the wind-up, 0.3 of the rest going out and 0.12 held: a
# contact held for three frames, the body back at rest by 0.55 s while the
# keyframed clip (0.9 s, 1.0 s for the tail) was still recovering, and legs
# that kept their flight pose throughout. Now each gesture lasts as long as
# its clip. The wind-up is still about 0.15 s, so a strike lands when it
# did. The strike goes out in 0.12 s, the contact is held for 0.19 s (11
# frames), and the recovery takes 0.44 s. The legs act: in a bite the fore
# claws thrust forward and the hind legs kick back; under a claw or a tail
# whip the hind legs drop and spread.
bite_duration 0.9
claw_duration 0.9
tail_duration 1.0
gesture_anticipation 0.17
gesture_strike_out 0.16
gesture_hold 0.25
gesture_legs 1

# The fingers bend up along their length under the membrane's load: degrees
# at the tip at a downstroke's fastest, a quarter of that in a glide
# (docs/showcase/HERO.md, "Fingers that bend"). From the front a downstroke
# was two rods with a strip of skin; at 24 the hand arcs and the sheet shows.
finger_load_curl_deg 24
