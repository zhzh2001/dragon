# Hero mesh: the bounds centre is 3.01 m over the soles at the 19 m wingspan.
ground_offset 3.01

# The wingbeat (docs/MOTION_REFERENCE.md, 2026-11-15). The defaults are a
# 0.9 s beat, 40% of it down, from +50 to -42 degrees. The reference dragons
# beat every 0.8 to 1.4 s, spend 44 to 60% of the beat on the downstroke and
# sweep 95 to 105 degrees. Thrust comes from the downstroke alone, so a
# downstroke 1.25 times as long takes a peak force 0.8 times as large
# (9000 N by default) to push the same.
#
# Second pass, the same day, after the playtest: "the wingbeat is slow, and
# the flapping range is still limited". At 1.1 s and +62 to -50 the tip, seen
# from the front, swept 53 degrees about the shoulder (+40 to -13): the rig
# spends much of the commanded angle on the fold and the trailing hand. Now
# 0.85 s (1.18 beats a second, Century's rate) and +66 to -78. At +90 the
# wings met over the head in a heart shape, and at +74 the tips still
# touched for a frame seen from behind; +66 leaves a clear V. The gain is at
# the bottom of the stroke, where the wings now reach well under the body.
flap_period 0.85
flap_downstroke_fraction 0.5
# 2026-11-21, the playtester: "the flapping range can increase more". The
# stroke was 66 up and 78 down by name, but on screen the tips stopped 35
# degrees under the level: the rig's ceiling was 90 and the hand lags the
# arm. At 72 and 125 (ceiling 130 in the rig profile) the tips reach about
# 55 degrees under and curl in at the bottom. At 145 the hands met under
# the belly.
flap_up_angle_deg 72
flap_down_angle_deg -125
flap_peak_force 7200
