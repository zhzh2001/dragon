# ironroot: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 60.0
neck_stiffness_scale 4.2
neck_gravity_scale 0.55
neck_inertia_scale 0.26
tail_damping_scale 0.9
tail_range_deg 58.0
chain_gravity 0.5
chain_tone 1.5

# --- wing stow. The ground_stow_* angle stow is zeroed: this wing is folded
# by the aimed stow at the end of the file. (Every ground_stow_* field
# defaults to 0.0, "do not fold at all", so a profile that lists only its
# character fields cannot close its wings -- the aim block is what does.)
tuck_droop_deg 12
speed_sweep_deg 20
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# --- flight legs. Use the sculpted knee bend with a moderate additional
# tuck; the lower paws stay clear of the torso and inner wing membrane.
leg_tuck_deg 15
leg_trail_deg 25
front_leg_trail_deg 25
leg_brake_extend 0.8
leg_brake_forward_deg 35

# --- jaw. Sculpted mouth-open like the rest of the roster: close at idle,
# open back to the sculpt on the breath. Only meaningful since the rebuild
# that put the mandible on the jaw bone (artifacts/ironroot/jaw-mask/README.md);
# before it this rotation lifted the snout. -22 over-closed it: the mandible
# swung up through the upper jaw and the teeth vanished into the skull,
# which read as a broken jaw on the ground. Four rest angles rendered
# side-on with --inspect-head; -12 is where the mouth just shuts.
jaw_rest_deg -12
jaw_open_deg 22

# --- standing. Generated from a rearing turnaround, and unlike Rimefang and
# Blightmaw this creature has its own skeleton (tools/skeletons/ironroot.json)
# whose thigh runs 38 degrees AFT in bind -- the trailing leg of the leap --
# so the hip swings a long way forward here where the shared skeleton's
# needed almost none. Screened from 1,536 angle sets for four feet on one
# floor with a forward thigh and a near-vertical forearm; two survived, two
# rendered, this one stands squarer.
ground_stance 1
ground_body_pitch_deg -15
ground_hip_deg 60
ground_knee_deg -20
ground_ankle_deg -30
ground_shoulder_deg 0
ground_elbow_deg -30

# The wing is folded by aiming each segment at a body-frame direction
# (docs/ANIMATION.md, "A folded wing is where its bones point"). These are
# short wings with a large wrist claw. The first fold laid the arm nearly
# straight forward along the flank, which collapsed the membrane into a small
# pouch under the shoulder -- "folded too tight and small" -- and a fold with
# the forearm level put the claws out sideways like handlebars. This one
# raises the wrist above the shoulder line, a little forward, so the folded
# membrane reads as a wing along the flank and the claws stand up behind the
# head; the claws are the sculpt's and go where the wrist goes. Six folds
# rendered side/front/rear/top.
ground_wing_aim 1
ground_wing_arm_sweep_deg 60
ground_wing_arm_elev_deg 20
ground_wing_forearm_sweep_deg -50
ground_wing_forearm_elev_deg 40
ground_wing_hand_sweep_deg 90
ground_wing_hand_elev_deg -35
ground_wing_fan_deg 12

# --- sole clearance. The stance keeps the lowest foot JOINT on the bind floor,
# and the paw mesh under a rotated foot reaches below it; measured by skinning
# the mesh on the CPU in the grounded stance (scratch sink probe) and taking
# the lowest vertex against the bind floor.
ground_lift_m 0.35
foot_hang_deg 10
toe_curl_deg 8
wing_flap_limit_deg 34
upstroke_fold_deg 14

# Flight fold is relative to the sculpted bend. Lower the combined hip/ankle
# rotation and paw curl so the feet remain below the hips and off the chest.
# Full-size glide, beat, dive and game checks: artifacts/flight-pose-fix/.
# Limit the beat and raised-wing fan fold to keep membrane clear of the
# horns and reduce wrist pinching; this leaves the standing wing aim intact.
# --- legs as pendulums. The code defaults (26 degrees of swing, stiffness
# 16, damping 6) let the legs hang correctly but barely move: a coordinated
# turn puts the effective gravity straight down the body, so only the
# reversals and the brake swing them, and the stiff spring followed those so
# closely that eight frames through an s-turn looked like one. Wider swing,
# more response to the frame's pseudo-forces, a slower and less damped spring,
# and a fuller float on the brake; measured with tools/rig_probes/
# leg_swing_probe (thigh range through the s-turn 30 -> 47 degrees on
# Frostvein) and rendered as eight-frame sequences.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
