# Embercrest textured rig profile.
#
# The imported wing has a shoulder -> elbow -> wrist arm and three finger
# chains. Keep the elbow open, then let the wrist and fingers make the fold.
# The flap ceiling protects the long membranes at the top of the stroke.
flap_shoulder_deg 36
wing_phase_lag 0.08
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1
wing_phase_lag 0.08
wing_phase_delay 0.035
wing_downstroke_fraction 0.40
wing_flap_fold_deg 14
wing_flap_limit_deg 42
wing_recovery_fold_deg 10
wing_recovery_extend_phase 0.68
upstroke_fold_deg 30

# The unprofiled speed/tuck fold put the wing tips nearly vertical in the dive.
tuck_sweep_deg 75
tuck_fold_deg 45
tuck_droop_deg 30
speed_sweep_deg 20
speed_fold_deg 8

# Keep the four limbs clear of the torso; braking partially unfolds them and
# lets the hips float toward the engine-forward direction.
leg_tuck_deg 42
leg_trail_deg 14
front_leg_trail_deg 10
leg_brake_extend 0.65
leg_brake_forward_deg 30

# The sculpt is already open. Close at idle; attack returns to the sculpted
# gape rather than stretching the cheek beyond it.
jaw_rest_deg -16
jaw_open_deg 16

# Standing stow. A tuck is a folded wing held OUT from the body; a standing
# wing is shut, and it is the FAN closing that shuts it -- the ribs swinging
# toward the innermost one, collapsing the membrane between them -- with the
# zigzag alternating the elbow and the wrist so the arm closes on itself
# rather than curling. Without both, "folded" left this dragon holding a full
# open sail out sideways. It ships no authored idle, so this is its only stance.
ground_stow_sweep_deg 55
ground_stow_fold_deg 20
ground_stow_wrist_deg 38
ground_stow_finger_deg -100
ground_stow_close_deg 90
ground_stow_converge_deg 90
