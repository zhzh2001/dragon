# Stormsail wyvern rig profile.
#
# A three-bone arm (root -> arm -> wrist) and four finger ribs, each a stub at
# the wrist plus one long rib. The ribs are what carry the membrane, so the
# fold lives at the knuckle between the two.
#
# The flight tuck is deliberately short of the standing fold: at the default
# 88/52 this wing closes far enough to put the two membranes through each other
# across the chest in a stoop. The ground adds the rest of the closure.
tuck_sweep_deg 64
tuck_fold_deg 36
tuck_droop_deg 16
speed_sweep_deg 22
speed_fold_deg 10

# Keep the arm open and let the wrist and ribs make the fold: the elbow sits
# 19% of the chord behind the leading edge, so it is bone, not membrane.
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1

# Standing stow. A tuck is a folded wing held OUT from the body; a standing
# wing is shut. The fan is what shuts it: these four ribs all start at the same
# point on the wrist and receive identical rotations, so no amount of folding
# converges them -- ground_stow_converge_deg swings each one toward the
# innermost and collapses the membrane between them. The zigzag then alternates
# the elbow and the wrist so the arm closes on itself instead of curling.
# This model ships no authored idle, so the procedural pose is its only stance.
ground_stow_sweep_deg 55
ground_stow_fold_deg 20
ground_stow_wrist_deg 20
ground_stow_finger_deg -100
ground_stow_close_deg 90
ground_stow_converge_deg 85

# --- jaw. The sculpt is authored mouth-open. Close it at idle and let the
# breath open it back to the sculpted gape, exactly as Embercrest does;
# without this the mouth hangs open in flight and the attack dislocates it
# another 26 degrees past the sculpt. Angles found by rendering the head
# side-on (--inspect 90 4 0 --inspect-head) against --bind-pose.
jaw_rest_deg -12
jaw_open_deg 14
