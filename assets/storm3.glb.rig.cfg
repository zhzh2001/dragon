# Storm3 uses the Stormsail wyvern profile. Both wings have three arm bones and four ribs.
# The tuck sweeps the wings back in a dive.
tuck_sweep_deg 40
tuck_fold_deg 10
tuck_droop_deg 30
speed_sweep_deg -14
speed_fold_deg 0

# The elbow, wrist and fingers share the fold.
wing_elbow_fold_scale 0.55
wing_wrist_fold_scale 1.0
wing_finger_fold_scale 1.1

# The standing pose uses wrist targets. The angle-based stow stays off.
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# The idle pose closes the sculpted gape. The jaw opens during the breath attack.
jaw_rest_deg -19
jaw_open_deg 30

# The ground stance controls the wing arms independently of the flight tuck.
ground_stow_tuck_share 0
ground_stow_elbow_scale 0

# The wrists land ahead of the hind toes. The tail rudder clears the level floor.
ground_stance 1
ground_wing_plant 1
ground_wing_aim 1
ground_body_pitch_deg -20
ground_hip_deg 24
ground_knee_deg -49
ground_ankle_deg 20
ground_neck_pitch_deg 35
ground_tail_pitch_deg -23
ground_lift_m .164
ground_wing_arm_sweep_deg -30
ground_wing_arm_elev_deg -24
ground_wing_forearm_sweep_deg -40
ground_wing_forearm_elev_deg -80
ground_wing_hand_sweep_deg 100
ground_wing_hand_elev_deg 55
ground_wing_fan_deg 6

# The legs fold under the body in flight.
leg_tuck_deg 45
leg_trail_deg 30
front_leg_trail_deg 30
foot_hang_deg 10
toe_curl_deg 8

# The legs swing during turns and braking.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
leg_brake_extend 0.8
leg_brake_forward_deg 35

# In a dive, the fingers close toward the leading rib.
tuck_converge_deg 20

# The scale gives Storm3 a body length of 13.55 m.
model_span_m 14.65

# The wings keep their sculpted tilt in flight.
wing_level_share 0

# The extended wing sweeps forward with speed. The tucked wing keeps its rearward sweep.
sweep_speed_start 22
sweep_speed_full 75

# The glide. The model is bound with its wings raised about 30 degrees, as
# its sheet drew them, and the flight model's glide is 9 degrees over the
# bind: a steep V. This lowers the wing in flight to the hero's dihedral.
# The stroke angles in the flight profile are measured from here.
wing_rest_deg -20
# Previously 0. Give each hind joint its own flight angle.
leg_flight_pose 1
# Previously 0. Keep the thigh under the reposed hip.
hind_flight_hip_deg 9
# Previously 0. Fold the shin against the belly.
hind_flight_knee_deg 27
# Previously 0. Point the foot aft alongside the tail.
hind_flight_hock_deg 47
# Previously 0. Draw the feet toward the tail root.
leg_flight_splay_deg -12
# Previously 45. Limit foot travel through the beat.
limb_range_deg 0.6
# Previously 35. Hold the thigh during the stroke reversal.
limb_stiffness 110
# Previously 0.5. Hold the foot almost as firmly as the hip.
limb_tip_stiffness 0.85
# Previously 0.6. Settle the foot as the wing changes direction.
limb_damping 0.95
