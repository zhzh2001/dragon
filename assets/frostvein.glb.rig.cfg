# Frostvein, fitted to tools/skeletons/frostvein.json.
# Pose validation and measurement record: artifacts/frostvein/README.md.
neck_stiffness_scale 8
neck_inertia_scale 0.12
tail_damping_scale 1.5
tail_range_deg 60
chain_tone 2.4

# --- legs in flight. This sculpt's legs are long, and at tuck 30 / trail 10
# the hind leg was nearly straight (a 24-degree knee) trailing back at hip
# height like a heron's -- "legs stretching too high". Tuck and trail are
# coupled: tuck rotates the thigh aft AND swings the shin forward relative to
# it, so more tuck straightened the leg further. A NEGATIVE tuck bends the
# knee (58 degrees at bind plus 1.15 x |tuck|) while a small trail brings the
# thigh forward, which folds the leg into a compact Z under the belly with
# the feet 1.8 m below the hips and under them, not behind. Screened over a
# tuck x trail grid in the glide (tools/rig_probes/leg_probe), three rendered
# from the side and behind, below.
leg_tuck_deg -40
leg_trail_deg 10
front_leg_trail_deg 10
foot_hang_deg 10
toe_curl_deg 8
leg_brake_extend 0.65
leg_brake_forward_deg 25

wing_flap_limit_deg 34
upstroke_fold_deg 14
# --- dive tuck. At 65/25 with 25 of droop the swept membrane hung down
# through the hind legs and the tips crossed over the tail (seen from below
# and above). Less sweep, more fold and almost no droop keep the hand above
# the legs and the tips apart; three tucks rendered from behind-below, side-
# below and above.
tuck_sweep_deg 55
tuck_fold_deg 35
tuck_droop_deg 5
speed_sweep_deg 15

# Aim the three wing segments for the standing fold. The first fold (arm 15,
# forearm 20, hand -10) hung the fingers down into the hind legs and hooked
# the wrists forward beside the head. A higher forearm and a level hand put
# the wrist at the shoulder line and the folded fingers along the back above
# the hips; two folds rendered side, front, rear and above.
ground_wing_aim 1
ground_wing_arm_sweep_deg 80
ground_wing_arm_elev_deg 20
ground_wing_forearm_sweep_deg -50
ground_wing_forearm_elev_deg 40
ground_wing_hand_sweep_deg 92
ground_wing_hand_elev_deg 0
ground_wing_fan_deg 8

# Close the sculpted mouth at rest and reopen it for frost breath.
jaw_rest_deg -20
jaw_open_deg 30

# The sculpt already stands on its paws; only lift the tail out of the floor.
ground_stance 1
ground_tail_pitch_deg 8
