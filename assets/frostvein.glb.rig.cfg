# Frostvein, fitted to tools/skeletons/frostvein.json.
# Pose validation and measurement record: artifacts/frostvein/README.md.
neck_stiffness_scale 8
neck_inertia_scale 0.12
tail_damping_scale 1.5
tail_range_deg 60
chain_tone 2.4

# --- legs in flight. This sculpt's legs are long. At tuck 30 / trail 10 the
# hind leg was nearly straight, trailing back at hip height like a heron's
# ("stretching too high"); folded into a compact Z under the belly (tuck -40)
# it was tidy and rigid, since a leg tucked against the body has nowhere
# visible to swing ("too rigid, try a natural dangling posture"). Tuck and
# trail are coupled -- tuck rotates the thigh aft AND swings the shin forward
# relative to it -- and a small tuck with a small trail leaves the thigh 15
# degrees aft with a 46-degree knee, the feet hanging 2.2 m below the hips
# and a little behind them, which is a relaxed hang that the pendulum below
# can move. Screened with the leg probe, rendered through the glide, an
# s-turn and a brake.
leg_tuck_deg 10
leg_trail_deg 5
front_leg_trail_deg 5
foot_hang_deg 10
toe_curl_deg 8
leg_brake_extend 0.8
leg_brake_forward_deg 35

wing_flap_limit_deg 34
upstroke_fold_deg 14
# --- dive tuck. At 65/25 with 25 of droop the swept membrane hung down
# through the hind legs and the tips crossed over the tail (seen from below
# and above). Less sweep, more fold and almost no droop keep the hand above
# the legs and the tips apart; three tucks rendered from behind-below, side-
# below and above.
tuck_sweep_deg 55
tuck_fold_deg 35
tuck_droop_deg 5
speed_sweep_deg 15

# Aim the three wing segments for the standing fold. The first fold (arm 15,
# forearm 20, hand -10) hung the fingers down into the hind legs and hooked
# the wrists forward beside the head. A higher forearm and a level hand put
# the wrist at the shoulder line and the folded fingers along the back above
# the hips; two folds rendered side, front, rear and above.
ground_wing_aim 1
ground_wing_arm_sweep_deg 80
ground_wing_arm_elev_deg 20
ground_wing_forearm_sweep_deg -50
ground_wing_forearm_elev_deg 40
ground_wing_hand_sweep_deg 92
ground_wing_hand_elev_deg 0
ground_wing_fan_deg 8

# Close the sculpted mouth at rest and reopen it for frost breath.
jaw_rest_deg -20
jaw_open_deg 30

# The sculpt already stands on its paws; only lift the tail out of the floor.
ground_stance 1
ground_tail_pitch_deg 8
# --- legs as pendulums. The code defaults (26 degrees of swing, stiffness
# 16, damping 6) let the legs hang correctly but barely move: a coordinated
# turn puts the effective gravity straight down the body, so only the
# reversals and the brake swing them, and the stiff spring followed those so
# closely that eight frames through an s-turn looked like one. Wider swing,
# more response to the frame's pseudo-forces, a slower and less damped spring,
# and a fuller float on the brake; measured with tools/rig_probes/
# leg_swing_probe (thigh range through the s-turn 30 -> 47 degrees on
# Frostvein) and rendered as eight-frame sequences.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
