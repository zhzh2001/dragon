# Frostvein, fitted to tools/skeletons/frostvein.json.
# Pose validation and measurement record: artifacts/frostvein/README.md.
neck_stiffness_scale 8
neck_inertia_scale 0.12
tail_damping_scale 1.5
tail_range_deg 60
chain_tone 2.4

# Moderate limb motion preserves the sculpt's own bends.
leg_tuck_deg 30
leg_trail_deg 10
front_leg_trail_deg 10
foot_hang_deg 10
toe_curl_deg 8
leg_brake_extend 0.65
leg_brake_forward_deg 25

wing_flap_limit_deg 34
upstroke_fold_deg 14
tuck_sweep_deg 65
tuck_fold_deg 25
tuck_droop_deg 25
speed_sweep_deg 15

# Aim the three wing segments along the flank for the standing fold.
ground_wing_aim 1
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 15
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg 20
ground_wing_hand_sweep_deg 88
ground_wing_hand_elev_deg -10
ground_wing_fan_deg 4

# Close the sculpted mouth at rest and reopen it for frost breath.
jaw_rest_deg -20
jaw_open_deg 30

# The sculpt already stands on its paws; only lift the tail out of the floor.
ground_stance 1
ground_tail_pitch_deg 8
