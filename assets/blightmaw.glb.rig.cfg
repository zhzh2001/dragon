# blightmaw: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 56.0
neck_stiffness_scale 4.6
neck_gravity_scale 0.5
neck_inertia_scale 0.24
tail_damping_scale 1.05
chain_gravity 0.46

# --- wing stow. The ground_stow_* angle stow is zeroed: this wing is folded
# by the aimed stow at the end of the file. (Every ground_stow_* field
# defaults to 0.0, "do not fold at all", so a profile that lists only its
# character fields cannot close its wings -- the aim block is what does.)
tuck_droop_deg 30
speed_sweep_deg 20
ground_stow_sweep_deg 0
ground_stow_fold_deg 0
ground_stow_wrist_deg 0
ground_stow_finger_deg 0
ground_stow_close_deg 0
ground_stow_converge_deg 0

# --- jaw. The sculpt is authored mouth-open. Close it at idle and let the
# breath open it back to the sculpted gape, exactly as Embercrest does;
# without this the mouth hangs open in flight and the attack dislocates it
# another 26 degrees past the sculpt. Angles found by rendering the head
# side-on (--inspect 90 4 0 --inspect-head) against --bind-pose.
jaw_rest_deg -20
jaw_open_deg 20

# --- flight legs. Use the sculpted knee bend with a moderate additional
# tuck; the lower paws stay clear of the torso and inner wing membrane.
leg_tuck_deg 55
leg_trail_deg 15
front_leg_trail_deg 15
leg_brake_extend 0.8
leg_brake_forward_deg 35

# --- neck. The sculpt binds the neck in a raised S with the head pitched
# some 35 degrees up, and the chain holds that shape in flight, so the horns
# stood straight up and the creature looked at the sky while flying level.
# The streamline steer lowers the neck into the wind; at 40 degrees, full
# from 20 m/s, the head flies level and the horns sweep back the way the
# sculpt draws them at rest. Found with a 60-degree probe first, since 35
# barely showed against the bind arch.
neck_streamline_deg 40
streamline_speed 20

# --- wings. This membrane is broad and lobed behind the arm, and the default
# recovery flex folded it into a crumpled pouch at mid-upstroke. A gentler
# flex keeps the span readable on this wing; the beat still has direction.
recovery_wrist_deg 12
recovery_finger_deg 6
recovery_droop_deg 10
upstroke_fold_deg 14

# --- dive tuck. Chosen from three tucks rendered side-on, head-on and from
# above at full tuck in the studio dive: the code defaults (88/52) folded the
# hands out sideways and hung membrane through the legs, and a shallower
# fold left a half-open delta. The elbow stays open and the fingers close
# harder, as on Embercrest, so the hand folds without forcing the elbow
# through the torso.
tuck_sweep_deg 75
tuck_fold_deg 45
wing_elbow_fold_scale 0.55
wing_finger_fold_scale 1.1

# --- standing. Generated from a rearing turnaround like Rimefang, and rigged
# on the same shared skeleton, so the bind pose is a leap with the chest high
# and the hind legs trailing -- and because this membrane is lobed and broad
# behind the arm, the rearing body hung it down the flanks to the ground like
# a tarp, which is what made the model look beyond saving. It was the pose,
# not the mesh: with the body pitched down and the legs under it the same
# membrane folds over the back like a bat's. Screened from 1,440 angle sets
# for four feet on one floor, two rendered; this one keeps the forelegs
# straightest.
ground_stance 1
ground_body_pitch_deg -15
ground_hip_deg -8
ground_knee_deg 75
ground_ankle_deg -40
ground_shoulder_deg 30
ground_elbow_deg -40

# The wing is folded by aiming each segment at a body-frame direction --
# Embercrest's directions, unchanged (docs/ANIMATION.md, "A folded wing is
# where its bones point"). The pleats read a little broad from the front,
# which is this membrane's size, not the fold.
ground_wing_aim 1
ground_wing_arm_sweep_deg 75
ground_wing_arm_elev_deg 15
ground_wing_forearm_sweep_deg -60
ground_wing_forearm_elev_deg 35
ground_wing_hand_sweep_deg 88
ground_wing_hand_elev_deg -20
ground_wing_fan_deg 8

# --- sole clearance. The stance keeps the lowest foot JOINT on the bind floor,
# and the paw mesh under a rotated foot reaches below it; measured by skinning
# the mesh on the CPU in the grounded stance (scratch sink probe) and taking
# the lowest vertex against the bind floor.
ground_lift_m 0.3
foot_hang_deg 10
toe_curl_deg 8
wing_flap_limit_deg 34

# Flight fold is relative to the sculpted bend. Lower the combined hip/ankle
# rotation and paw curl so the feet remain below the hips and off the chest.
# Full-size glide, beat, dive and game checks: artifacts/flight-pose-fix/.
# Limit the beat and raised-wing fan fold to keep membrane clear of the
# horns and reduce wrist pinching; this leaves the standing wing aim intact.
# --- legs as pendulums. The code defaults (26 degrees of swing, stiffness
# 16, damping 6) let the legs hang correctly but barely move: a coordinated
# turn puts the effective gravity straight down the body, so only the
# reversals and the brake swing them, and the stiff spring followed those so
# closely that eight frames through an s-turn looked like one. Wider swing,
# more response to the frame's pseudo-forces, a slower and less damped spring,
# and a fuller float on the brake; measured with tools/rig_probes/
# leg_swing_probe (thigh range through the s-turn 30 -> 47 degrees on
# Frostvein) and rendered as eight-frame sequences.
leg_sway_max_deg 40
leg_sway_response 1.5
leg_sway_stiffness 12
leg_sway_damping 4.5
