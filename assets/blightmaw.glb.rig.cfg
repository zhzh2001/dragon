# blightmaw: species animation. Only the fields that differ from the
# defaults are listed -- load_rig_tuning leaves everything else alone.
flap_shoulder_deg 56.0
neck_stiffness_scale 4.6
neck_gravity_scale 0.5
neck_inertia_scale 0.24
tail_damping_scale 1.05
chain_gravity 0.46

# --- wing stow. NOT optional: every ground_stow_* field defaults to 0.0 in
# dragon_rig.h, which means "do not fold at all", so a rig profile that lists
# only its character fields leaves the creature unable to close its wings on
# the ground or in a dive. Seeded from Embercrest's hand-tuned values.
tuck_droop_deg 12
speed_sweep_deg 20
ground_stow_sweep_deg 55
ground_stow_fold_deg 20
ground_stow_wrist_deg 20
ground_stow_finger_deg -100
ground_stow_close_deg 90
ground_stow_converge_deg 90

# --- jaw. The sculpt is authored mouth-open. Close it at idle and let the
# breath open it back to the sculpted gape, exactly as Embercrest does;
# without this the mouth hangs open in flight and the attack dislocates it
# another 26 degrees past the sculpt. Angles found by rendering the head
# side-on (--inspect 90 4 0 --inspect-head) against --bind-pose.
jaw_rest_deg -20
jaw_open_deg 20

# --- legs. Seeded like the stow block: the code defaults (tuck 62, trail
# 38/30) left this creature hanging its legs under the body like landing
# gear. A deeper tuck with a moderate trail presses them up along the belly
# -- chosen from three variants rendered side-on and head-on in the glide.
leg_tuck_deg 72
leg_trail_deg 22
front_leg_trail_deg 18
leg_brake_extend 0.65
leg_brake_forward_deg 30

# --- neck. The sculpt binds the neck in a raised S with the head pitched
# some 35 degrees up, and the chain holds that shape in flight, so the horns
# stood straight up and the creature looked at the sky while flying level.
# The streamline steer lowers the neck into the wind; at 40 degrees, full
# from 20 m/s, the head flies level and the horns sweep back the way the
# sculpt draws them at rest. Found with a 60-degree probe first, since 35
# barely showed against the bind arch.
neck_streamline_deg 40
streamline_speed 20

# --- wings. This membrane is broad and lobed behind the arm, and the default
# recovery flex folded it into a crumpled pouch at mid-upstroke. A gentler
# flex keeps the span readable on this wing; the beat still has direction.
recovery_wrist_deg 12
recovery_finger_deg 6
recovery_droop_deg 10
upstroke_fold_deg 14
